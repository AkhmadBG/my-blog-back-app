plugins {
    id 'java'
    id 'war'
}

group = 'ru.yandex.practicum'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    implementation("org.springframework:spring-core:7.0.7")
    implementation("org.springframework:spring-web:7.0.7")
    implementation("org.springframework:spring-webmvc:7.0.7")
    implementation("org.springframework.data:spring-data-jdbc:4.0.0")

    implementation("org.postgresql:postgresql:42.7.11")

    implementation("jakarta.validation:jakarta.validation-api:3.1.1")
    compileOnly("jakarta.servlet:jakarta.servlet-api:6.1.0")

    implementation("org.mapstruct:mapstruct:1.6.3")
    annotationProcessor("org.mapstruct:mapstruct-processor:1.6.3")

    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")

    annotationProcessor("org.projectlombok:lombok-mapstruct-binding:0.2.0")

    implementation("org.slf4j:slf4j-simple:2.0.17")

    implementation("com.fasterxml.jackson.core:jackson-core:2.17.0")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.17.0")
    implementation("com.fasterxml.jackson.core:jackson-annotations:2.17.0")

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.12.2")
    testImplementation("org.junit.jupiter:junit-jupiter-params:5.12.2")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.12.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.12.2")

    testImplementation("org.springframework:spring-test:7.0.7")
    testImplementation("org.mockito:mockito-core:5.23.0")
    testImplementation("com.h2database:h2:2.4.240")
}

test {
    useJUnitPlatform()
}